services:
  middle-tool-mcp:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        APP_VERSION: "0.1.0"
    image: middle-tool-mcp:latest
    container_name: middle-tool-mcp
    restart: unless-stopped
    ports:
      - "${MIDDLE_TOOL_MCP_PORT:-8080}:8080"
    environment:
      MIDDLE_TOOL_MCP_HOST: 0.0.0.0
      MIDDLE_TOOL_MCP_PORT: "8080"
      MIDDLE_TOOL_CONFIG_PATH: /app/config/middle-tool-config.json
      ROCKETMQ_MCP_JAR_PATH: /app/runtime/rocketmq-mcp.jar
      REDIS_MCP_COMMAND: uvx
    volumes:
      - ${MIDDLE_TOOL_CONFIG_FILE:-./config/middle-tool-config.json}:/app/config/middle-tool-config.json:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
